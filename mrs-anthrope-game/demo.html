<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MRS. ANTHROPE - Stage 1: Road to the Gig</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; }
  #start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px;
    color: #f6ecd6; font: bold 22px monospace; letter-spacing: 2px; cursor: pointer; background: rgba(0, 0, 0, .55); text-align: center; }
  #start small { font-size: 13px; color: #a5a9bf; letter-spacing: 1px; }
</style>
</head>
<body>
<canvas id="screen" width="320" height="180"></canvas>
<div id="start">&#9654; PRESS START<small>Klick oder Enter &ndash; mit Sound</small></div>
<script src="js/assets.js"></script>
<script src="js/engine.js"></script>
<script src="js/game.js"></script>
<script src="js/audio.js"></script>
<script>
  MA.loadTitle();
  var cv = document.getElementById('screen'), ctx = cv.getContext('2d');
  var img = ctx.createImageData(MA.W, MA.H), buf = new MA.Buf(MA.W, MA.H);
  var overlay = document.getElementById('start');
  var actx = null, audioBuf = null, game = null, t0 = 0, running = false;

  // show the title screen behind the overlay
  (function preview() { var g = new MA.Game(); for (var i = 0; i < 40; i++) g.step(); g.render(buf); MA.toRGBA(buf, img.data, 0); ctx.putImageData(img, 0, 0); })();

  function start() {
    if (running) return;
    running = true;
    overlay.innerHTML = 'LOADING&hellip;';
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    actx.resume();
    setTimeout(function () {
      if (!audioBuf) {
        var sim = new MA.Game();
        while (!sim.done) sim.step();
        var a = MA.renderAudio(sim.events, sim.frame, 60);
        audioBuf = actx.createBuffer(2, a.L.length, a.sr);
        audioBuf.getChannelData(0).set(a.L); audioBuf.getChannelData(1).set(a.R);
      }
      var src = actx.createBufferSource();
      src.buffer = audioBuf; src.connect(actx.destination);
      game = new MA.Game();
      t0 = actx.currentTime + 0.1;
      src.start(t0);
      overlay.style.display = 'none';
      requestAnimationFrame(loop);
    }, 30);
  }
  function loop() {
    var target = Math.floor((actx.currentTime - t0) * 60);
    while (game.frame < target && !game.done) game.step();
    game.render(buf);
    MA.toRGBA(buf, img.data, game.fadeLevel());
    ctx.putImageData(img, 0, 0);
    if (!game.done) requestAnimationFrame(loop);
    else { running = false; overlay.innerHTML = '&#9654; PLAY AGAIN'; overlay.style.display = 'flex'; }
  }
  overlay.addEventListener('click', start);
  window.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') start(); });
</script>
</body>
</html>

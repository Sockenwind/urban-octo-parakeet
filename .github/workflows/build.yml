name: Build macOS App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build with PyInstaller
      run: |
        # Use the build script or run directly.
        # Using pyinstaller directly to ensure visibility in logs.
        pyinstaller --noconfirm --onefile --windowed --name "CleanDrive" main.py

    - name: Zip the App
      run: |
        cd dist
        zip -r CleanDrive.zip CleanDrive.app

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CleanDrive-macOS
        path: dist/CleanDrive.zip
